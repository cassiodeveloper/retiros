<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>Nie znaleziono strony</title>
</head>
<body>
  <script>
    const path = window.location.pathname;
    const base = path.includes("/retiros/") ? "/retiros/" : "/";

    if (path.includes("/retreat/")) {
      const id = path.split("/retreat/")[1];
      window.location.href = `${base}retreat.html?id=${encodeURIComponent(id)}`;
    } else {
      window.location.href = `${base}index.html`;
    }
  </script>
</body>
</html>
